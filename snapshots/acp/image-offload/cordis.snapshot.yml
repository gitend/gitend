# Keyless replay for the image-offload scenario. This profile patch swaps the
# adapter and re-pins the recorded vision model. The replay catalog declares
# image input and a base64 request-image budget that six 69-byte frames
# (92 base64 bytes each) exceed, so the agent loop appends an `image/offload`
# watermark before the first dispatch and the second turn sends placeholders.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]
                # A wide context window keeps automatic compaction out of the
                # scenario; the base64 budget admits three of the six frames.
                contextWindow: 200000
                imageRequestTokens: 384
                imageRequestMaxBytes: 300

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
